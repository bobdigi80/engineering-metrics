name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --collect "XPlat Code Coverage" --results-directory test-results

      - name: Publish Lambda packages
        run: |
          dotnet publish src/EngineeringMetrics.Collector --no-restore -c Release -o artifacts/collector
          dotnet publish src/EngineeringMetrics.Api --no-restore -c Release -o artifacts/api

      - run: npm ci

      - name: CDK synth
        run: npx cdk synth --quiet

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

  deploy:
    name: Deploy to AWS
    needs: build
    # Runs only on main, and only once the deploy role has been created (see README).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token to assume the AWS role; no stored AWS keys
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Publish Lambda packages
        run: |
          dotnet publish src/EngineeringMetrics.Collector -c Release -o artifacts/collector
          dotnet publish src/EngineeringMetrics.Api -c Release -o artifacts/api

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: CDK deploy
        run: npx cdk deploy EngineeringMetrics --require-approval never
